services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: madura_erp_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - madura_network
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=madura_erp_db
      - DB_USERNAME=madura_user
      - DB_PASSWORD=madura_secret

  webserver:
    image: nginx:alpine
    container_name: madura_erp_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - madura_network
    depends_on:
      - app

  db:
    image: postgis/postgis:16-3.4
    container_name: madura_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: madura_erp_db
      POSTGRES_USER: madura_user
      POSTGRES_PASSWORD: madura_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - madura_network

networks:
  madura_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

